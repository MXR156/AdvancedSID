name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/AdvancedSID.Core.Tests -c Release

      - name: Publish single-file EXE
        run: dotnet publish src/AdvancedSID/AdvancedSID.csproj -c Release -r win-x64 -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedSID
          path: publish/AdvancedSID.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/AdvancedSID.exe
